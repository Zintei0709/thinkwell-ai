name: CI/CD

# CI: every push and pull request runs the contract tests and builds the site.
# CD: pushes to the default branch also deploy the site to GitHub Pages,
#     but only after every CI job has passed.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # "Run workflow" button for a manual redeploy

# Read-only by default; the deploy job asks for the extra scopes it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never interrupt a run that may be deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Contracts (Truffle tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start Ganache
        run: |
          npm run chain > "$RUNNER_TEMP/ganache.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -X POST -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}' \
              http://127.0.0.1:8545 | grep -q '"result"'; then
              echo "Ganache is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Ganache failed to start"
          exit 1

      - name: Run Truffle tests
        run: npm test

      - name: Show Ganache log
        if: failure()
        run: cat "$RUNNER_TEMP/ganache.log" || true

  site:
    name: Site (type-check & build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only on the default branch: reads the Pages URL so assets resolve under
      # https://<owner>.github.io/<repo>/. PR builds keep the "/" base.
      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/configure-pages@v6

      - name: Type-check and build
        run: npm run build
        env:
          VITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [contracts, site]
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
